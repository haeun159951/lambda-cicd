name: Deploy AWS Lambda Function
on:
  push:
    branches:
      - main
    paths: 
      - 'lambda/**'        
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python # setups our python now
        uses: actions/setup-python@v2
        with:
          python-version: '3.14'

      - name: Install dependencies #install any packages
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -t lambda/

      - name: Configure AWS credentials # sets up our aws credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda function
        run: |
          cd lambda
          zip -r lambda_function.zip .
          aws lambda update-function-code --function-name my-test-cicd-lambda --zip-file fileb://lambda_function.zip