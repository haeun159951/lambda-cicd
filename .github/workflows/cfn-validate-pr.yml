name: Validate CloudFormation Template on PR
on:
  pull_request:
    paths:
      - 'cloudformation/**'     
permissions:    
    pull-requests: write
    contents: read

jobs:
  validate-cfn:
    runs-on: ubuntu-latest
    env:
      STACK_NAME: cfn-validate-pr-${{ github.event.pull_request.number }}
    steps: 
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Validate CloudFormation Template
        run: |
          for template in cloudformation/*.yaml; do
            echo "Validating $template"
            aws cloudformation validate-template --template-body file://$template
          done 

      - name: Deploy our stack
        run: |
          aws cloudformation create-stack --stack-name $STACK_NAME --template-body file://cloudformation/s3-bucket.yaml --parameters ParameterKey=environment,ParameterValue=test

      - name: Comment on the PR
        uses: actions/github-script@v6
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
                const stackName = process.env.STACK_NAME;
                github.rest.issues.createComment({
                    issue_number: context.payload.pull_request.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `CloudFormation template validated and stack ${stackName} created successfully!`
                })

  cleanup_on_merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    env:
      STACK_NAME: cfn-validate-pr-${{ github.event.pull_request.number }}
    steps:
      - name: configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Delete CloudFormation Stack
        run: |
          echo "Deleting stack $STACK_NAME"
          aws cloudformation delete-stack --stack-name $STACK_NAME  
